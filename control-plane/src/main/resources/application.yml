spring:
  application:
    name: aegiscloud-control-plane

  # In-flight requests are allowed to finish on SIGTERM. A control plane that
  # drops a scaling decision midway through shutdown would leave the very
  # inconsistency it exists to prevent.
  lifecycle:
    timeout-per-shutdown-phase: 10s

  # The 23-table schema in db/migration is the source of truth. Nothing
  # auto-generates DDL from Java types.
  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      # Never let Hibernate touch DDL. Flyway migrations are the only thing that
      # changes the schema, so an entity mapping that disagrees with the database
      # is a bug to fix in the mapping, not a reason to alter the table.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    serialization:
      # Timestamps go out as ISO-8601 strings. The dashboard parses these with
      # new Date(...), which cannot read the epoch-decimal form Jackson would
      # otherwise emit for Instant.
      write-dates-as-timestamps: false
    default-property-inclusion: always

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger

logging:
  level:
    io.aegiscloud: INFO

# The autonomous control loop (Phase 4). Every value here is a safety property
# rather than a tuning knob, so each one is stated explicitly instead of being
# left to a default buried in code.
aegiscloud:
  control-plane:
    # How often the loop reconciles the fleet. Long enough that a rollout
    # finishes between cycles, short enough that a crash-looping pod is not
    # left alone for minutes.
    interval-ms: ${AEGISCLOUD_LOOP_INTERVAL_MS:60000}
    # Nothing is reconciled until the application has finished starting and
    # Flyway has run.
    initial-delay-ms: ${AEGISCLOUD_LOOP_INITIAL_DELAY_MS:20000}
    # The flapping guard: no target is scaled twice inside this window, whatever
    # the metrics say.
    scaling-cooldown-seconds: ${AEGISCLOUD_SCALING_COOLDOWN_SECONDS:180}
    # How long an applied action is given to take effect before its outcome is
    # judged. Shorter than this and a rollout in progress reads as a regression.
    verification-delay-seconds: ${AEGISCLOUD_VERIFICATION_DELAY_SECONDS:60}

  # The Evaluation Engine (Phase 5). These govern how often the platform measures
  # and over what window it judges, so they are stated rather than buried.
  evaluation:
    # How often every registered endpoint is probed.
    interval-ms: ${AEGISCLOUD_EVALUATION_INTERVAL_MS:60000}
    initial-delay-ms: ${AEGISCLOUD_EVALUATION_INITIAL_DELAY_MS:15000}
    # The window a Reliability Score covers. Short enough that a score reacts to an
    # incident while it is happening; SLO windows are separate and far longer,
    # because an error budget that forgets last week is not a budget.
    score-window-minutes: ${AEGISCLOUD_SCORE_WINDOW_MINUTES:60}
    # Kubernetes watches. Detection through the informer arrives in seconds; the
    # scheduled sweep above stays as the backstop that catches anything a dropped
    # watch missed.
    watch-enabled: ${AEGISCLOUD_WATCH_ENABLED:true}
    # A crash-looping pod emits a burst of events; the first one is acted on and the
    # rest are absorbed rather than each starting its own reconciliation.
    watch-debounce-seconds: ${AEGISCLOUD_WATCH_DEBOUNCE_SECONDS:10}
    watch-start-delay-ms: ${AEGISCLOUD_WATCH_START_DELAY_MS:10000}
    watch-refresh-ms: ${AEGISCLOUD_WATCH_REFRESH_MS:120000}

  # Root cause analysis (Phase 8).
  rca:
    # The reliability score under which a service counts as degraded and becomes a
    # candidate in an incident.
    degraded-below: ${AEGISCLOUD_RCA_DEGRADED_BELOW:80}
    # How far back RCA looks for the changes and the degradation onset it cites.
    lookback-minutes: ${AEGISCLOUD_RCA_LOOKBACK_MINUTES:30}
